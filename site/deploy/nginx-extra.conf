# Extra Nginx rules for the website, meant for the per-site "extension" include of a panel-managed vhost (a file ending in .conf
# that the vhost includes at server level).  Not applied by the build; copy it by hand and run `nginx -t` before reloading.
#
# Why: a catch-all `location ~ .*\.(js|css)?$ { expires 12h; }` (the panel's default) also matches every .html file and the files below,
# so browsers and the CDN keep serving an old page or an old download for up to 12 hours.  Pages and CSS/JS referenced from pages
# carry a content hash in their URL (?v=...) and can be cached; the HTML itself and the download files cannot.
#
# This is the first regex location in the server block (the include comes before the panel's own locations), so it wins over the catch-all.
# add_header inside a location replaces what the server level declares, which is why the shared header file is included again in each.
#
# Assumes the security headers are in security_headers.conf next to this file.  Adjust the include path to where that file lives.
#
# Also: text files must say they are UTF-8 (llms.txt and llms-full.txt are Chinese; without a charset a client may decode them as Latin-1 and show
# garbage), Markdown copies are served as text/markdown instead of a download (and kept out of search results: the HTML page is the one to index,
# while language-model clients fetch the .md), and the installer and its checksums are plain text so a browser shows them instead of saving them.

# every text type that carries our Chinese text says so
charset utf-8;
charset_types text/xml text/plain text/vnd.wap.wml application/javascript application/rss+xml text/markdown text/css application/json;

# Markdown copies of the component and guide pages
location ~* \.md$ {
    include /path/to/security_headers.conf;
    default_type text/markdown;
    add_header X-Robots-Tag "noindex, follow" always;
    add_header Cache-Control "public, max-age=300" always;
}

# HTML: always revalidate
location ~* \.html$ {
    include /path/to/security_headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
}

# Downloads and the installer: a short cache keeps a new release from being hidden for hours
location = /install.sh {
    default_type text/plain;
    include /path/to/security_headers.conf;
    add_header Cache-Control "public, max-age=300" always;
}
location = /SHA256SUMS {
    default_type text/plain;
    include /path/to/security_headers.conf;
    add_header Cache-Control "public, max-age=300" always;
}
location ~* ^/assets/zhaoui-[0-9.]+\.zip$ {
    include /path/to/security_headers.conf;
    add_header Cache-Control "public, max-age=300" always;
}
location ^~ /assets/zhaoui/ {
    include /path/to/security_headers.conf;
    add_header Cache-Control "public, max-age=300" always;
}
