<!doctype html>
<html lang="zh-CN" data-audience="c" data-mode="light" data-density="standard">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 | 登录页模板</title>
<meta name="description" content="用 ZhaoUI 搭的登录页模板：居中卡片、带校验的表单和第三方登录入口。">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="@@LIB@@/zhaoui.min.css">
<link rel="stylesheet" href="@@LIB@@/zhaoui-utilities.min.css">
<link rel="stylesheet" href="@@LIB@@/zhaoui-marketing.min.css">
<style>
  .tpl-login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--zh-gradient-soft); }
  .tpl-login-box { width: 100%; max-width: 26rem; padding: 36px 32px; }
  .tpl-login-box h1 { margin: 18px 0 6px; font-size: 1.6em; }
  .tpl-brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; color: inherit; text-decoration: none; }
  .tpl-brand i { width: 28px; height: 28px; border-radius: 8px; background: var(--zh-color-primary); }
  .tpl-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .tpl-foot { margin: 20px 0 0; text-align: center; color: var(--zh-text-secondary); }
</style>
</head>
<body>
<!-- ZhaoUI 模板：文案和数据都是占位示例，请替换成你自己的内容。样式和脚本在 @@LIB@@/ 下。 -->
<main id="main" class="tpl-login">
  <div class="zh-card tpl-login-box">
    <a class="tpl-brand" href="landing.html"><i aria-hidden="true"></i><span>示例科技</span></a>
    <h1>登录你的账号</h1>
    <p style="margin:0 0 24px;color:var(--zh-text-secondary)">欢迎回来，请输入邮箱和密码。</p>
    <form class="zh-stack" id="login-form" novalidate>
      <div class="zh-field">
        <label for="l-mail" class="zh-req">邮箱</label>
        <input id="l-mail" class="zh-input" type="email" name="email" autocomplete="email" placeholder="name@example.com" required aria-describedby="l-mail-h">
        <span class="zh-hint" id="l-mail-h"></span>
      </div>
      <div class="zh-field">
        <label for="l-pass" class="zh-req">密码</label>
        <input id="l-pass" class="zh-input" type="password" name="password" autocomplete="current-password" required aria-describedby="l-pass-h">
        <span class="zh-hint" id="l-pass-h"></span>
      </div>
      <div class="tpl-row"><label class="zh-check"><input type="checkbox" name="remember"> 记住我</label><a href="#">忘记密码？</a></div>
      <button class="zh-btn primary lg" type="submit">登录</button>
    </form>
    <p class="tpl-foot">还没有账号？<a href="pricing.html">免费注册</a></p>
  </div>
</main>
<script src="@@LIB@@/zhaoui.min.js"></script>
<script src="@@LIB@@/zhaoui-icons.min.js"></script>
<script>
  // 示例：只做前端校验，没有提交到任何地方。接入你自己的登录接口时，在这里发请求。
  (function () {
    var form = document.getElementById('login-form');
    function check(input, hint, message) {
      var ok = input.checkValidity();
      input.setAttribute('aria-invalid', ok ? 'false' : 'true');
      hint.textContent = ok ? '' : message; hint.className = ok ? 'zh-hint' : 'zh-hint err';
      return ok;
    }
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var a = check(document.getElementById('l-mail'), document.getElementById('l-mail-h'), '请输入正确的邮箱');
      var b = check(document.getElementById('l-pass'), document.getElementById('l-pass-h'), '请输入密码');
      if (a && b) ZhaoUI.message('校验通过（示例，没有提交）');
    });
  })();
</script>
</body>
</html>
