name: 报告问题（Bug report）
description: 组件显示、行为或无障碍的问题
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 发生了什么，你期望什么
      description: 截图很有帮助
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 最好给一个能直接打开的最小 HTML，或 https://ui.352m.com/playground.html 的分享链接
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: 浏览器和版本、操作系统
      placeholder: 例如 Chrome 130 / Windows 11 / 缩放 125%
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: ZhaoUI 版本
      placeholder: 例如 0.1.0
